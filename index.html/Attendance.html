<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--ac:#2563eb;--bd:#e2e6ec;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#92a0b1;--bd:#2c3642}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#92a0b1;--bd:#2c3642}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:120px}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:transparent;color:var(--bad);padding:4px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
.batch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
.batch.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.batch.full{opacity:.5;cursor:not-allowed}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}
.pill.full{color:var(--bad);border-color:var(--bad)}.mu{color:var(--mu)}.msg{padding:10px;border-radius:8px;margin-top:10px}
.msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}.msg.bad{background:rgba(220,38,38,.12);color:var(--bad)}
table{width:100%;border-collapse:collapse;margin-bottom:6px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;width:fit-content;margin:10px auto}
.lb{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}.tabs{display:flex;gap:6px;margin-bottom:12px}
#printArea{display:none}
@media print{body{background:#fff;color:#000}main>*:not(#printArea){display:none!important}#printArea{display:block}
@page{size:landscape}table{font-size:12px}th,td{border:1px solid #999}h2{margin-top:18px}}
</style></head><body><main id="app"><p class="mu">Loading…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let db,user,me={id:null},isAdmin=false,view='admin',batches=[],regs=[],seats=[],fields=[],sel=null,msg=null,link=location.href.split('#')[0].split('?')[0],formOnly=/[?&]form=1/.test(location.search)||location.hash==='#form',ans={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const count=b=>seats.filter(r=>r.batchId===b).length;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function guestId(){let v=lsGet('aid');if(!v){v='g'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('aid',v)}catch(e){}}return v}
const snap=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
async function init(){
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  if(!db){$('#app').innerHTML='<div class="card">Please open this link inside Claude while signed in.</div>';return}
  isAdmin=!formOnly&&(user?user.canEdit():false);
  try{if(user)me.id=await user.id()}catch(e){}
  if(!me.id)me.id=guestId();
  if(!isAdmin)view='attend';
  db.collection('batches').onSnapshot(s=>{batches=snap(s);render()});
  db.collection('fields').onSnapshot(s=>{fields=snap(s);render()});
  db.collection('seats').onSnapshot(s=>{seats=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  if(isAdmin)db.collection('registrations').onSnapshot(s=>{regs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  render();
}
function render(){
  const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.keep)return;
  $('#app').innerHTML=(isAdmin?`<div class="tabs"><button class="${view==='admin'?'':'g'}" onclick="go('admin')">Admin</button><button class="${view==='attend'?'':'g'}" onclick="go('attend')">Preview attendee form</button></div>`:'')+(view==='admin'?adminHTML():attendHTML());
  if(view==='admin')drawQR();
}
function go(v){view=v;msg=null;render()}
function fieldInput(f){
  const v=esc(ans[f.id]||''),r=f.required?' *':'';
  let inp;
  if(f.type==='select')inp=`<select data-keep="1" onchange="ans['${f.id}']=this.value"><option value="">Select…</option>${(f.options||[]).map(o=>`<option ${ans[f.id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else inp=`<input data-keep="1" type="${f.type==='number'?'number':'text'}" value="${v}" oninput="ans['${f.id}']=this.value">`;
  return `<label class="lb">${esc(f.label)}${r}</label>${inp}`;
}
function attendHTML(){
  const mine=seats.find(r=>r.id===me.id);
  let h='<h1>Attendance</h1><div class="card">';
  if(mine){const b=batches.find(x=>x.id===mine.batchId);return h+`<h2>You're checked in ✔</h2><p><b>${esc(b?b.name:'')}</b></p></div>`}
  if(!batches.length||!fields.length)return h+'<p class="mu">This form is not open yet.</p></div>';
  h+=fields.map(fieldInput).join('')+'<h2 style="margin-top:16px">Choose your batch *</h2>';
  batches.forEach(b=>{const n=count(b.id),full=n>=b.capacity;
    h+=`<div class="batch ${full?'full':''} ${sel===b.id?'sel':''}" onclick="${full?'':`pick('${b.id}')`}"><b>${esc(b.name)}</b><span class="pill ${full?'full':''}">${full?'FULL':(b.capacity-n)+' slots left'}</span></div>`});
  h+=`<button style="width:100%;margin-top:6px" onclick="submitAtt()">Submit</button>`;
  if(msg)h+=`<div class="msg ${msg.t}">${esc(msg.m)}</div>`;
  return h+'</div>';
}
function pick(id){sel=id;msg=null;const ae=document.activeElement;if(ae&&ae.blur)ae.blur();render()}
async function submitAtt(){
  for(const f of fields)if(f.required&&!String(ans[f.id]||'').trim()){msg={t:'bad',m:`Please fill in: ${f.label}`};return render()}
  const b=batches.find(x=>x.id===sel);
  if(!b){msg={t:'bad',m:'Please choose a batch.'};return render()}
  if(count(b.id)>=b.capacity){msg={t:'bad',m:'That batch just filled up. Pick another.'};return render()}
  try{
    const seat=db.collection('seats').doc(me.id),ts=Date.now();
    await seat.set({batchId:b.id,ts});
    const q=await db.collection('seats').where('batchId','==',b.id).orderBy('ts','asc').limit(b.capacity).get();
    if(!q.docs.some(d=>d.id===me.id)){await seat.delete();msg={t:'bad',m:'That batch just filled up. Pick another.'}}
    else{await db.collection('registrations').doc(me.id).set({answers:ans,batchId:b.id,ts});msg={t:'ok',m:'Attendance recorded!'}}
  }catch(e){msg={t:'bad',m:'Could not save. Please try again.'}}
  render();
}
const PRE=[['Name','text'],['Department','text'],['Position','text'],['Age','number'],['Email','text'],['Contact No.','text']];
function adminHTML(){
  let h='<h1>Attendance Admin</h1>';
  h+=`<div class="card"><h2>1 · Build the form</h2>`;
  fields.forEach(f=>{h+=`<div class="row" style="margin-bottom:6px"><b style="flex:1">${esc(f.label)}</b><span class="pill">${f.type}${f.required?' · required':''}</span><button class="d" onclick="delField('${f.id}')">✕</button></div>`});
  h+=`<p class="mu" style="margin:10px 0 6px">Quick add:</p><div class="row">${PRE.filter(p=>!fields.some(f=>f.label===p[0])).map(p=>`<button class="g" onclick="addField('${p[0]}','${p[1]}',true)">+ ${p[0]}</button>`).join('')}</div>`;
  h+=`<div class="row" style="margin-top:10px"><input id="fl" data-keep="1" placeholder="Custom field label"><select id="ft" data-keep="1" style="max-width:110px"><option value="text">Text</option><option value="number">Number</option><option value="select">Dropdown</option></select></div><div class="row" style="margin-top:6px"><input id="fo" data-keep="1" placeholder="Dropdown options, comma-separated"><label><input id="fr" type="checkbox" checked style="width:auto"> Required</label><button onclick="customField()">Add field</button></div></div>`;
  h+=`<div class="card"><h2>2 · Batches &amp; limits</h2>`;
  batches.forEach(b=>{h+=`<div class="row" style="margin-bottom:6px"><b style="flex:1">${esc(b.name)}</b><span class="pill">${count(b.id)} / ${b.capacity}</span><button class="d" onclick="delBatch('${b.id}')">Delete</button></div>`});
  h+=`<div class="row" style="margin-top:10px"><input id="bn" data-keep="1" placeholder="Batch name (e.g. Batch A – 9:00 AM)"><input id="bc" data-keep="1" type="number" min="1" placeholder="Limit" style="max-width:90px"><button onclick="addBatch()">Add</button></div></div>`;
  h+=`<div class="card"><h2>3 · Generate attendee link &amp; QR code</h2><p class="mu">Once the form and batches are ready, preview it, then generate the link. The link and QR code open <b>only the attendee form</b>.</p><div class="row"><button class="g" onclick="go('attend')">Preview attendee form</button><button onclick="genLink()">Generate link &amp; QR</button></div>`;
  if(gen)h+=`<p class="mu" style="margin-top:12px">Step A: press Share (top right), give <b>Contributor</b> access, copy that link and paste it here:</p><input data-keep="1" value="${esc(link)}" onchange="link=this.value.split('#')[0].split('?')[0];render()"><p class="mu" style="margin-top:12px">Step B: share this attendee-only link / QR:</p><input readonly data-keep="1" value="${esc(formUrl())}" onclick="this.select()"><div id="qr"></div><div class="row"><button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText(formUrl())">Copy link</button></div>`;
  h+=`</div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">4 · Attendance list (${regs.length})</h2><button onclick="window.print()">Print</button></div><div style="margin-top:10px;overflow-x:auto">${tables(true)}</div></div>`;
  h+=`<div id="printArea"><h1>Attendance List</h1><p>${new Date().toLocaleString()}</p>${tables(false)}</div>`;
  return h;
}
function tables(ctl){
  if(!batches.length)return '<p class="mu">No batches yet.</p>';
  const th=fields.map(f=>`<th>${esc(f.label)}</th>`).join('');
  return batches.map(b=>{const l=regs.filter(r=>r.batchId===b.id).sort((x,y)=>x.ts-y.ts);
    const rows=l.map((r,i)=>`<tr><td>${i+1}</td>${fields.map(f=>`<td>${esc((r.answers||{})[f.id])}</td>`).join('')}<td>${new Date(r.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>${ctl?`<td><button class="d" onclick="delReg('${r.id}')">✕</button></td>`:'<td style="width:18%"></td>'}</tr>`).join('')||`<tr><td colspan="${fields.length+3}" class="mu">No attendees yet</td></tr>`;
    return `<h2>${esc(b.name)} <span class="mu">(${l.length}/${b.capacity})</span></h2><table><tr><th>#</th>${th}<th>Time</th>${ctl?'<th></th>':'<th>Signature</th>'}</tr>${rows}</table>`}).join('');
}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
async function addField(label,type,req,options){await db.collection('fields').doc(uid('f')).set({label,type,required:!!req,options:options||[],order:Date.now()})}
async function customField(){const l=$('#fl').value.trim();if(!l)return;const t=$('#ft').value,o=$('#fo').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(t==='select'&&!o.length)return alert('Add dropdown options.');await addField(l,t,$('#fr').checked,o)}
async function delField(id){await db.collection('fields').doc(id).delete()}
async function addBatch(){const n=$('#bn').value.trim(),c=parseInt($('#bc').value,10);if(!n||!c||c<1)return;
  await db.collection('batches').doc(uid('b')).set({name:n,capacity:c,order:Date.now()})}
async function delBatch(id){if(confirm('Delete this batch and its attendees?')){for(const r of seats.filter(r=>r.batchId===id)){await db.collection('seats').doc(r.id).delete();await db.collection('registrations').doc(r.id).delete()}await db.collection('batches').doc(id).delete()}}
async function delReg(id){await db.collection('seats').doc(id).delete();await db.collection('registrations').doc(id).delete()}
const formUrl=()=>link.split('#')[0].split('?')[0]+'?form=1';
let gen=false;
function genLink(){if(!fields.length||!batches.length){alert('Add at least one form field and one batch first.');return}gen=true;render()}
function drawQR(){const q=$('#qr');if(!q||!gen||typeof QRCode==='undefined')return;q.innerHTML='';new QRCode(q,{text:formUrl(),width:180,height:180})}
init();
</script></body></html>
